<!DOCTYPE html>
<html>
<head>
    <title>My Entertainment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">My Entertainment</div>
            <ul class="nav-links">
                <li><a href="#movies">Movies</a></li>
                <li><a href="#tv">TV Shows</a></li>
                <li><a href="#search">Search</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to My Entertainment</h1>
            <p>Explore movies and TV shows</p>
        </section>
        <section id="movies" class="movies">
            <h2>Movies</h2>
            <div class="movie-grid">
                <div class="movie-card">Movie 1</div>
                <div class="movie-card">Movie 2</div>
                <div class="movie-card">Movie 3</div>
            </div>
        </section>
        <section id="tv" class="tv-shows">
            <h2>TV Shows</h2>
            <div class="tv-grid">
                <div class="tv-card">TV Show 1</div>
                <div class="tv-card">TV Show 2</div>
                <div class="tv-card">TV Show 3</div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Entertainment</p>
    </footer>
</body>
</html>
